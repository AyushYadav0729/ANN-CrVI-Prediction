<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cr(VI) Removal Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>ANN-Based Cr(VI) Removal Efficiency Predictor</h1>
            <p class="subtitle">
                Enter adsorption parameters below to predict Cr(VI) removal efficiency.
            </p>

            <form method="POST" class="form-grid">
                <div class="form-group full-width">
                    <label for="adsorbent">Adsorbent</label>
                    <select id="adsorbent" name="adsorbent" required>
                        <option value="" disabled {% if not selected_adsorbent %}selected{% endif %}>
                            Select an adsorbent
                        </option>
                        {% for ads in adsorbent_options %}
                        <option value="{{ ads }}" {% if selected_adsorbent == ads %}selected{% endif %}>
                            {{ adsorbent_display_map.get(ads, ads) }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="time">Time (minutes)</label>
                    <input type="number" id="time" name="time"
                        min="0" max="5000" step="1"
                        placeholder="e.g. 100"
                        value="{{ request.form.get('time', '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="initial_concentration">Initial Concentration (mg/L)</label>
                    <input type="number" id="initial_concentration" name="initial_concentration"
                        min="0" max="1000" step="0.1"
                        placeholder="e.g. 10"
                        value="{{ request.form.get('initial_concentration', '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="ph">pH (0–14)</label>
                    <input type="number" id="ph" name="ph"
                        min="0" max="14" step="0.1"
                        placeholder="e.g. 3"
                        value="{{ request.form.get('ph', '') }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="dosage">Dosage (g/L)</label>
                    <input type="number" id="dosage" name="dosage"
                        min="0" max="50" step="0.01"
                        placeholder="e.g. 0.7"
                        value="{{ request.form.get('dosage', '') }}"
                        required>
                </div>

                <div class="form-group full-width">
                    <label for="temperature">Temperature (°C)</label>
                    <input type="number" id="temperature" name="temperature"
                        min="0" max="150" step="0.1"
                        placeholder="e.g. 25"
                        value="{{ request.form.get('temperature', '') }}"
                        required>
                </div>

                <div class="full-width">
                    <button type="submit">Predict</button>
                </div>
            </form>

            {% if prediction is not none %}
            <div class="result-box">
                <h2>Prediction Result</h2>
                <p>Predicted Removal Efficiency:</p>
                <div class="result-value">{{ prediction }}%</div>
            </div>
            {% endif %}

            {% if error %}
            <div class="error-box">
                <h2>Error</h2>
                <p>{{ error }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
